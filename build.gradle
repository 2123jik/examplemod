plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories { }

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// ============================================================
//  DATA 精简模式：./gradlew runData -PdataOnly
//  思路：不维护"必需 mod 白名单"，改为"排除纯客户端 mod"
//  这样所有 L2 / Apothic 依赖链都自动带上，不会一轮轮漏
// ============================================================
def dataOnly = project.hasProperty('dataOnly')

def modsDir = 'C:\\Users\\lyj\\AppData\\Roaming\\PrismLauncher\\instances\\hostility\\minecraft\\mods'

// 所有模式都排除：开发环境自身 / 与 datagen 无关
def baseExclude = [
        'ProbeJS-7.7.2.jar',
        'kubejs-neoforge-2101.7.2-build.321.jar',
        'rhino-2101.2.7-build.81.jar',
        'examplemod-1.0.0.jar',
        'iris-*.jar', 'Iris-*.jar',
        'EuphoriaPatcher-*.jar', 'euphoria*.jar',
        'MouseTweaks-*.jar', 'mousetweaks*.jar',
        'sodium-*.jar', 'Sodium-*.jar',
]

// data 模式额外排除：纯客户端 / UI / 渲染 / 输入交互
// datagen 里一行都不用，且它们经常是崩溃来源
def dataExtraExclude = [
        'iris-*.jar', 'Iris-*.jar',
        'EuphoriaPatcher-*.jar', 'euphoria*.jar',
        'MouseTweaks-*.jar', 'mousetweaks*.jar',
        'sodium-*.jar', 'Sodium-*.jar',
        'embeddium-*.jar', 'Embeddium-*.jar',
        'ModernUI-*.jar', 'modernui-*.jar',
        'jade-*.jar', 'Jade-*.jar', 'JadeAddons*.jar',
        'jeed-*.jar',
        'journeymap-*.jar', 'JourneyMap*.jar',
        'trashslot-*.jar', 'TrashSlot-*.jar',
        'StylishEffects*.jar', 'stylisheffects-*.jar',
        'entityculling-*.jar', 'EntityCulling*.jar',
        'TRender-*.jar', 'trender-*.jar',
        'simplytooltips-*.jar',
        'collapsible_groups*.jar',
        'powerful_dummy*.jar',
]

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // 编译时：全部 jar 参与，保证 IDE 索引正常
    compileOnly fileTree(dir: modsDir, include: ['*.jar'], exclude: baseExclude)
    compileOnly files("libs/l2core-3.0.8+12.jar")

    if (dataOnly) {
        runtimeOnly fileTree(dir: modsDir, include: ['*.jar'],
                exclude: baseExclude + dataExtraExclude)
        println "[build.gradle] ===== DATA 模式 ====="
        println "[build.gradle] 排除 jar 数 = ${(baseExclude + dataExtraExclude).size()}"
    } else {
        runtimeOnly fileTree(dir: modsDir, include: ['*.jar'], exclude: baseExclude)
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/repo" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('removeComments') {
    description = '使用 JavaParser 删除 src/main/java 下所有 Java 文件的注释'
    doLast {
        RemoveComments.process(file('src/main/java'))
    }
}