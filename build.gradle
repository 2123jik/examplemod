// 构建后自动将产物覆盖拷贝到 PrismLauncher mods 目录
tasks.register('copyJarToPrismMods', Copy) {
    group = 'build'
    description = '将构建生成的 Mod Jar 自动覆盖复制到 PrismLauncher mods 目录'
    dependsOn tasks.named('jar')

    from(layout.buildDirectory.dir('libs')) {
        include("${base.archivesName.get()}-*.jar")
        exclude('*-sources.jar')
        exclude('*-javadoc.jar')
    }

    into(file(modsDir))
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named('build') {
    finalizedBy(tasks.named('copyJarToPrismMods'))
}

// 模组实际引用分析器
tasks.register('findUsedMods') {
    group = 'developer'
    description = '精准分析当前代码实际引用了哪些第三方模组的 JAR'

    def srcDir = layout.projectDirectory.dir('src/main/java').asFile
    def classpathCollection = configurations.compileClasspath

    inputs.dir(srcDir).withPropertyName('srcDir').optional()
    inputs.files(classpathCollection).withPropertyName('classpathCollection')

    doLast {
        if (!srcDir.exists()) {
            println "❌ 未找到源码目录: ${srcDir}"
            return
        }

        def javaFiles = []
        srcDir.eachFileRecurse(FileType.FILES) { f ->
            if (f.name.endsWith('.java')) {
                javaFiles.add(f)
            }
        }

        if (javaFiles.isEmpty()) {
            println "❌ 源码目录下没有 Java 文件！"
            return
        }

        def myPackages = [] as Set
        javaFiles.each { f ->
            f.eachLine { line ->
                def m = line =~ /^\s*package\s+([a-zA-Z0-9_.]+);/
                if (m) myPackages.add(m[0][1])
            }
        }

        def importedClasses = [] as Set
        def wildcardPackages = [] as Set

        javaFiles.each { f ->
            f.eachLine { line ->
                def m = line =~ /^\s*import\s+(?:static\s+)?([a-zA-Z0-9_.]+)(?:\.\*)?;/
                if (m) {
                    def fullPath = m[0][1]
                    if (!fullPath.startsWith('java.') &&
                            !fullPath.startsWith('javax.') &&
                            !fullPath.startsWith('net.minecraft.') &&
                            !fullPath.startsWith('net.neoforged.') &&
                            !myPackages.any { fullPath.startsWith(it) }) {

                        if (line.contains('.*;')) {
                            wildcardPackages.add(fullPath.replace('.', '/'))
                        } else {
                            importedClasses.add(fullPath.replace('.', '/') + '.class')
                        }
                    }
                }
            }
        }

        if (importedClasses.isEmpty() && wildcardPackages.isEmpty()) {
            println "ℹ️ 你的代码没有调用任何第三方模组的类（只调用了原版/NeoForge）。"
            return
        }

        println "🔍 正在从白名单依赖中比对 ${importedClasses.size()} 个外部引用类的归属..."

        def usedJars = [:]

        def jarsToCheck = classpathCollection.files.findAll {
            it.name.endsWith('.jar') && !it.name.contains('minecraft') && !it.name.contains('neoforge')
        }

        jarsToCheck.each { jarFile ->
            try {
                def zip = new ZipFile(jarFile)
                def matched = []
                importedClasses.each { classEntry ->
                    if (zip.getEntry(classEntry) != null) {
                        matched.add(classEntry.replace('/', '.').replace('.class', ''))
                    }
                }
                wildcardPackages.each { pkgEntry ->
                    if (zip.entries().any { it.name.startsWith(pkgEntry) }) {
                        matched.add(pkgEntry.replace('/', '.') + '.*')
                    }
                }
                if (!matched.isEmpty()) {
                    usedJars[jarFile.name] = matched
                }
                zip.close()
            } catch (Exception ignored) {
            }
        }

        println "\n" + "=" * 70
        println "🎯 你的项目源码【实际 import 调用】的第三方模组清单 (共 ${usedJars.size()} 个) :"
        println "=" * 70

        if (usedJars.isEmpty()) {
            println "⚠️ 发现了外部引用，但未在已加载的 Jar 中找到对应类，请检查白名单是否遗漏。"
        } else {
            usedJars.each { jarName, classes ->
                println "\n📦 [模组 Jar]: ${jarName}"
                classes.each { cls ->
                    println "    └─ 调用了: ${cls}"
                }
            }
        }
        println "\n" + "=" * 70
        println "💡 结论：白名单生效中，当前项目仅依赖上述实际引用的模组！"
        println "=" * 70
    }
}