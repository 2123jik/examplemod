// ==============================================================================
// 🛠️ 自动化引擎：智能寻找匹配的最新 Jar 包
// ==============================================================================
def findModJarFile = { String prefix ->
    def modsFolder = file(modsDir)
    if (!modsFolder.exists()) return null
    def pLower = prefix.toLowerCase()
    return modsFolder.listFiles().find { f ->
        if (!f.name.endsWith(".jar")) return false
        def nameLower = f.name.toLowerCase()
        nameLower.startsWith(pLower + "-") ||
                nameLower.startsWith(pLower + "_") ||
                nameLower.startsWith(pLower + " ") ||
                nameLower.startsWith(pLower + ".")
    }
}

// 收集白名单匹配成功的 Jar
def resolvedWhitelistJars = []
launcherModWhitelist.each { prefix ->
    def matchedJar = findModJarFile(prefix)
    if (matchedJar) {
        resolvedWhitelistJars.add(matchedJar)
    } else {
        println "⚠️ [白名单提示] 启动器 mods 目录中暂未匹配到前缀为 [${prefix}] 的 Jar 包"
    }
}

// ==============================================================================
// 🛠️ 自动化引擎：自动解压白名单 Jar 内部的 Jar-in-Jar (如 l2core, l2serial 等)
// ==============================================================================
def extractedJarInJarDir = layout.buildDirectory.dir("extracted-jarjar").get().asFile

def extractJarInJars = {
    if (!extractedJarInJarDir.exists()) extractedJarInJarDir.mkdirs()
    resolvedWhitelistJars.each { jarFile ->
        try {
            def zip = new ZipFile(jarFile)
            zip.entries().findAll { entry ->
                !entry.directory && (entry.name.startsWith("META-INF/jarjar/") || entry.name.startsWith("META-INF/jars/")) && entry.name.endsWith(".jar")
            }.each { entry ->
                def subJarName = new File(entry.name).name
                def targetFile = new File(extractedJarInJarDir, subJarName)
                // 增量提取：仅当文件不存在或修改过时写入
                if (!targetFile.exists() || targetFile.length() != entry.size) {
                    targetFile.withOutputStream { os ->
                        os << zip.getInputStream(entry)
                    }
                    println "⚡ [Jar-in-Jar 自动提取] 从 ${jarFile.name} 提取出: ${subJarName}"
                }
            }
            zip.close()
        } catch (Exception ignored) {}
    }
}

extractJarInJars()

// ==============================================================================
// 📦 依赖配置 (纯本地闭环，没有任何远程 Mod 依赖)
// ==============================================================================
dependencies {
    // 1. 白名单模组内置的 Jar-in-Jar (如 l2core, l2serial, l2damagetracker)
    compileOnly fileTree(dir: extractedJarInJarDir, include: ['*.jar'])

    // 2. 本地 libs 文件夹 (备用纯本地扩展)
    compileOnly fileTree(dir: 'libs', include: ['*.jar'], exclude: ['*-sources.jar', '*-javadoc.jar'])

    // 3. 统一加载白名单里的启动器模组 (神化、L2、灾变、铁魔法等统统由此引入)
    implementation files(resolvedWhitelistJars)

    // 4. 原生框架必要依赖
    jarJar(implementation("com.tterrag.registrate:Registrate:MC1.21-1.3.0+67"))
    exporterRuntime 'com.github.javaparser:javaparser-core:3.26.2'
    compileOnly 'com.github.javaparser:javaparser-core:3.26.2'
}

